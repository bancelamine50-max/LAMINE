<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu de Mémoire - Animaux & Fruits</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card-front {
            background-color: #4f46e5;
            color: white;
        }

        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            border: 2px solid #e5e7eb;
        }

        .card.matched .card-back {
            background-color: #f0fdf4;
            border-color: #86efac;
        }

        #modal-win {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-800 text-gray-800 mb-2">Jeu de Mémoire</h1>
            <p class="text-gray-500 text-sm">Trouvez toutes les paires !</p>
        </header>

        <!-- Sélecteur de Thème -->
        <div class="flex justify-center gap-4 mb-6">
            <button onclick="changeTheme('animals')" id="btn-animals" class="px-4 py-2 rounded-xl text-sm font-bold transition-all border-2">🦁 Animaux</button>
            <button onclick="changeTheme('fruits')" id="btn-fruits" class="px-4 py-2 rounded-xl text-sm font-bold transition-all border-2">🍎 Fruits</button>
        </div>

        <!-- Stats -->
        <div class="flex justify-around mb-6 bg-gray-50 p-4 rounded-2xl">
            <div class="text-center">
                <span class="block text-[10px] uppercase font-bold text-gray-400">Coups</span>
                <span id="moves" class="text-xl font-bold">0</span>
            </div>
            <div class="text-center">
                <span class="block text-[10px] uppercase font-bold text-gray-400">Temps</span>
                <span id="timer" class="text-xl font-bold">00:00</span>
            </div>
        </div>

        <div id="grid" class="grid-container">
            <!-- Les cartes sont générées ici -->
        </div>

        <button onclick="initGame()" class="w-full mt-6 bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700 transition-all">
            Nouvelle Partie
        </button>
    </div>

    <!-- Modal Victoire -->
    <div id="modal-win">
        <div class="bg-white rounded-3xl p-8 max-w-xs w-full text-center shadow-2xl">
            <div class="text-5xl mb-4">🏆</div>
            <h2 class="text-2xl font-bold mb-2">Bravo !</h2>
            <p class="text-gray-500 mb-6">Terminé en <span id="final-moves" class="font-bold text-indigo-600"></span> coups.</p>
            <button onclick="initGame()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Rejouer</button>
        </div>
    </div>

    <script>
        const themes = {
            animals: ['🐶', '🐱', '🦁', '🐯', '🐼', '🐨', '🦊', '🐸'],
            fruits: ['🍎', '🍓', '🍌', '🍇', '🍉', '🍍', '🥝', '🍒']
        };

        let currentTheme = 'animals';
        let flippedCards = [];
        let lockBoard = false;
        let moves = 0;
        let matches = 0;
        let time = 0;
        let timerInterval;

        function changeTheme(theme) {
            currentTheme = theme;
            updateThemeButtons();
            initGame();
        }

        function updateThemeButtons() {
            const btnAnimals = document.getElementById('btn-animals');
            const btnFruits = document.getElementById('btn-fruits');
            
            if (currentTheme === 'animals') {
                btnAnimals.className = "px-4 py-2 rounded-xl text-sm font-bold bg-indigo-100 text-indigo-700 border-indigo-200";
                btnFruits.className = "px-4 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-600 border-transparent";
            } else {
                btnFruits.className = "px-4 py-2 rounded-xl text-sm font-bold bg-indigo-100 text-indigo-700 border-indigo-200";
                btnAnimals.className = "px-4 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-600 border-transparent";
            }
        }

        function initGame() {
            clearInterval(timerInterval);
            document.getElementById('modal-win').style.display = 'none';
            document.getElementById('grid').innerHTML = '';
            flippedCards = [];
            lockBoard = false;
            moves = 0;
            matches = 0;
            time = 0;
            document.getElementById('moves').innerText = '0';
            document.getElementById('timer').innerText = '00:00';

            const items = [...themes[currentTheme], ...themes[currentTheme]];
            items.sort(() => Math.random() - 0.5);

            items.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${emoji}</div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                document.getElementById('grid').appendChild(card);
            });

            startTimer();
            updateThemeButtons();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                time++;
                const mins = Math.floor(time / 60).toString().padStart(2, '0');
                const secs = (time % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function flipCard() {
            if (lockBoard || this.classList.contains('flipped')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                flippedCards = [];
                if (matches === themes[currentTheme].length) win();
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function win() {
            clearInterval(timerInterval);
            document.getElementById('final-moves').innerText = moves;
            setTimeout(() => {
                document.getElementById('modal-win').style.display = 'flex';
            }, 500);
        }

        window.onload = initGame;
    </script>
</body>
</html>
